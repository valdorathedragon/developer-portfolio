<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vedant Srivastava — Interactive Galaxy Resume</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Cinematic Loading Screen -->
  <div id="loader" class="loader" role="status" aria-live="polite">
    <div class="loader-ring"></div>
    <p class="loader-text">INITIALIZING SECTOR // VEDANT SRIVASTAVA</p>
  </div>

  <!-- 3D WebGL Galaxy Canvas -->
  <canvas id="galaxy-canvas" aria-label="Interactive 3D Resume Galaxy"></canvas>

  <!-- Floating 2D Planet Labels Layer -->
  <div id="labels-layer" class="labels-layer" aria-hidden="true"></div>

  <!-- Subtle Edge Vignette -->
  <div class="vignette" aria-hidden="true"></div>

  <!-- Top HUD Bar -->
  <header class="hud-top">
    <div class="brand">
      <span class="brand-dot" aria-hidden="true"></span>
      <div>
        <h1 class="brand-name" id="hud-name">Vedant Srivastava</h1>
        <p class="brand-sub" id="hud-role">BCA — AI &amp; Data Science</p>
      </div>
    </div>

    <div class="hud-controls">
      <button id="audio-toggle" class="hud-btn" type="button" aria-pressed="false" title="Toggle ambient space audio">
        <span class="btn-icon" aria-hidden="true">🔇</span>
        <span class="btn-label">Ambient: Off</span>
      </button>
      <button id="a11y-toggle" class="hud-btn" type="button" aria-expanded="false" aria-controls="accessible-view">
        <span class="btn-icon" aria-hidden="true">☰</span>
        <span class="btn-label">Text View</span>
      </button>
    </div>
  </header>

  <!-- Intro Onboarding Hint -->
  <div id="explore-hint" class="explore-hint" role="status">
    Click a planet to explore &bull; Drag to orbit &bull; Scroll to zoom
  </div>

  <!-- Glassmorphism Planet Info Panel -->
  <aside id="info-panel" class="info-panel" role="dialog" aria-modal="true" aria-labelledby="panel-title" hidden>
    <div class="panel-header">
      <div class="panel-meta">
        <span id="panel-index" class="panel-index">01 / 07</span>
        <span id="panel-tag" class="panel-tag">CORE STAR</span>
      </div>
      <button id="panel-close" class="close-btn" type="button" aria-label="Return to galaxy view">
        &larr; Galaxy View <kbd>ESC</kbd>
      </button>
    </div>

    <h2 id="panel-title" class="panel-title">About Me</h2>
    <div id="panel-body" class="panel-body"></div>

    <div class="panel-footer">
      <button id="prev-planet" class="nav-step-btn" type="button">&larr; Previous Sector</button>
      <button id="next-planet" class="nav-step-btn" type="button">Next Sector &rarr;</button>
    </div>
  </aside>

  <!-- Bottom HUD Planet Navigation Bar -->
  <nav class="hud-nav" aria-label="Resume Sections">
    <ul id="planet-nav-list" class="planet-nav-list"></ul>
  </nav>

  <!-- Accessible Text Fallback Overlay -->
  <main id="accessible-view" class="accessible-view" hidden>
    <div class="accessible-container">
      <div class="accessible-top">
        <h2>Accessible Resume View</h2>
        <button id="a11y-close" class="hud-btn" type="button">Return to 3D Galaxy</button>
      </div>
      <div id="accessible-content"></div>
    </div>
  </main>

  <noscript>
    <div class="noscript-fallback">
      <h1>Vedant Srivastava</h1>
      <p>+91-9560678977 | 2601060015@krmu.edu.in | Gurugram, Haryana</p>
      <p>GitHub: https://github.com/valdorathedragon | LinkedIn: https://linkedin.com/in/vedant-srivastava-945123404</p>
      <h2>Education</h2>
      <p>Bachelor of Computer Applications (BCA) — Artificial Intelligence &amp; Data Science, K.R. Mangalam University, Gurugram (Expected: December 2029)</p>
      <h2>Technical Skills</h2>
      <p>Languages: Python, Bash / Shell Scripting, SQL | Tools: Git, GitHub, VS Code, Linux Terminal, Postman, Ollama | Concepts: File Systems, Process Management, REST APIs, Markdown, Prompt Engineering</p>
      <h2>Projects</h2>
      <ul>
        <li><strong>Mule Account Detection Engine</strong> (November 2026) — Python, Pandas, Scikit-Learn, SQLite</li>
      </ul>
      <h2>Extra-Curricular</h2>
      <p>Aarambhathon 2.0 University Hackathon — K.R. Mangalam University (November 2026)</p>
    </div>
  </noscript>

  <!-- Pinned Three.js Build (UMD compatible with both file:// and GitHub Pages) -->
  <script src="https://cdn.jsdelivr.net/npm/three@0.149.0/build/three.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
